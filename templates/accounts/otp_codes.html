{% extends "base.html" %}
{% block title %}Códigos de respaldo{% endblock %}
{% block content %}
<section class="panel">
  <h1>Guarda estos códigos</h1>
  <p>Cada uno sirve una vez. No se vuelven a mostrar.</p>
  <ul class="codes">
    {% for code in codes %}<li>{{ code }}</li>{% endfor %}
  </ul>
  <a class="btn" href="{% url 'otp_status' %}">Listo</a>
</section>
{% endblock %}
