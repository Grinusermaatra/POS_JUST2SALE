{% if page.paginator.num_pages > 1 %}
<nav class="pager" aria-label="Páginas">
  {% if page.has_previous %}
  <a href="?page={{ page.previous_page_number }}{% if query %}&{{ query }}{% endif %}">Anterior</a>
  {% endif %}
  <span>{{ page.number }} / {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}
  <a href="?page={{ page.next_page_number }}{% if query %}&{{ query }}{% endif %}">Siguiente</a>
  {% endif %}
</nav>
{% endif %}
